[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "av-safety-eval"
version = "0.1.0"
description = "Scenario-based safety evaluation for autonomous driving under trajectory prediction uncertainty."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "matplotlib",
  "pyyaml",
]

[project.optional-dependencies]
sim = [
  "gymnasium",
  "highway-env",
]
dev = [
  "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
